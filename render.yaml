services:
  - type: web
    name: osint-early-warning-dashboard-2-0
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: HORIZON_DB_PATH
        value: /var/data/horizon.sqlite
      - key: HORIZON_REFRESH_MINUTES
        value: "15"
      - key: PYTHONPATH
        value: /app
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: osint-sqlite-data
      mountPath: /var/data
      sizeGB: 1
