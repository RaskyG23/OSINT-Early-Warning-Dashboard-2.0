services:
  osint-dashboard:
    build: .
    image: osint-early-warning-dashboard:local
    container_name: osint-early-warning-dashboard
    init: true
    ports:
      - "8502:8501"
    volumes:
      # Mount the application source so safe dashboard fixes are visible after
      # a container restart without relying on a stale previously built image.
      - ./app:/app/app:ro
      - ./data:/app/data
    environment:
      PYTHONPATH: /app
      OSINT_DB_PATH: /app/data/osint-dashboard.sqlite
      OSINT_REFRESH_MINUTES: ${OSINT_REFRESH_MINUTES:-15}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      BARENTSWATCH_CLIENT_ID: ${BARENTSWATCH_CLIENT_ID:-}
      BARENTSWATCH_CLIENT_SECRET: ${BARENTSWATCH_CLIENT_SECRET:-}
      GFW_API_ACCESS_TOKEN: ${GFW_API_ACCESS_TOKEN:-}
      OPENSKY_TOKEN: ${OPENSKY_TOKEN:-}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
